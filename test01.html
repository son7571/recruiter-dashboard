<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>포지션 제안</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 10px;
        }

        .profile-box {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .profile-info {
            flex: 1;
        }

        .profile-button {
            background: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }

        .toggle {
            display: inline-block;
            width: 40px;
            height: 20px;
            background: #007bff;
            border-radius: 10px;
            position: relative;
        }

        .toggle::after {
            content: "";
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
        }

        .recommend-list {
            display: flex;
            gap: 20px;
        }

        .recommend-card {
            flex: 1;
            background: white;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .recommend-card img {
            width: 100%;
            height: auto;
        }

        .recommend-card-content {
            padding: 10px;
        }

        .btn-detail {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 12px;
            background: #000;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 제안 안내 -->
        <div class="card">
            <div class="title">받은 제안</div>
            <div class="subtitle">
                <h4>포지션 제안받기 기능을 활성화하면 기업의 인사담당자가 보내는 포지션 제안을 받을 수 있습니다. 매력적으로 보일 수 있도록 프로필을 자주 업데이트해 주세요.</h4>
            </div>
        </div>

        <!-- 프로필 매칭 -->
        <div class="card">
            <div class="profile-box">
                <div class="profile-info">
                    <div><strong>프로필: 매칭 중</strong></div>
                    <div class="subtitle">면접 제안을 받으면 이메일로 제안 메일이 전송됩니다.</div>
                </div>
                <div>
                    <button class="profile-button">프로필 확인 / 수정</button>
                    <div class="toggle"></div>
                </div>
            </div>
        </div>

        <!-- 기업 추천 -->
        <div class="card">
            <div class="title">기업 추천</div>
            <div class="recommend-list">
                <div class="recommend-card">
                    <img src="https://via.placeholder.com/300x150?text=회사+1" alt="기업1" />
                    <div class="recommend-card-content">
                        <div>풀스택 Django 백엔드 개발자</div>
                        <a href="#" class="btn-detail">상세보기</a>
                    </div>
                </div>
                <div class="recommend-card">
                    <img src="https://via.placeholder.com/300x150?text=회사+2" alt="기업2" />
                    <div class="recommend-card-content">
                        <div>백엔드 개발자 (Java, 2년 이상)</div>
                        <a href="#" class="btn-detail">상세보기</a>
                    </div>
                </div>
                <div class="recommend-card">
                    <img src="https://via.placeholder.com/300x150?text=회사+3" alt="기업3" />
                    <div class="recommend-card-content">
                        <div>Django 백엔드 개발자 (경력)</div>
                        <a href="#" class="btn-detail">상세보기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
